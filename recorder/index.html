<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ozni — Gravador de campo</title>
<style>
  :root{
    --bg:#0f1115; --card:#1a1d24; --ink:#f2f4f8; --muted:#9aa3b2;
    --accent:#3b82f6; --danger:#ef4444; --ok:#22c55e; --amber:#f59e0b; --line:#2a2e38;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5;-webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 60px}
  header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:8px 0 14px}
  h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:13px;margin:3px 0 0}
  .ver{color:var(--muted);font-size:11px;margin:4px 0 0;font-variant-numeric:tabular-nums;opacity:.7}
  .toggles{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
  .seg{display:flex;gap:4px}
  .seg button{background:var(--card);border:1px solid var(--line);color:var(--muted);
    border-radius:7px;padding:5px 10px;font-size:13px;font-weight:600;cursor:pointer}
  .seg button.on{color:var(--ink);border-color:var(--accent)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
  .card h2{font-size:14px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  ul.rules{margin:0;padding-left:18px}
  ul.rules li{margin:5px 0;font-size:14px}
  ul.rules b{color:var(--amber)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  .label-row{display:flex;gap:8px;margin-bottom:10px}
  .label-row input{flex:1;min-width:0;width:100%;background:#11141a;border:1px solid var(--line);color:var(--ink);
    border-radius:10px;padding:11px 12px;font-size:16px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .chips button{background:#11141a;border:1px solid var(--line);color:var(--muted);
    border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer}
  .chips button:active{border-color:var(--accent);color:var(--ink)}
  .meter{height:14px;background:#11141a;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
  .meter > div{height:100%;width:0;background:var(--ok);transition:width .06s linear}
  .meter.clip > div{background:var(--danger)}
  .meterrow{display:flex;justify-content:space-between;font-size:12px;margin-top:5px;color:var(--muted)}
  .clipwarn{color:var(--danger);font-weight:700;display:none}
  .meter.clip ~ .meterrow .clipwarn{display:inline}
  .timer{font-size:40px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:14px 0 6px}
  .recbtn{display:block;margin:0 auto;width:96px;height:96px;border-radius:50%;border:none;
    background:var(--accent);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
  .recbtn.rec{background:var(--danger)}
  .err{color:var(--danger);font-size:13px;margin-top:10px;text-align:center}
  .rec{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .rec .nm{flex:1 0 100%;min-width:0;font-size:13px;overflow-wrap:anywhere}
  .rec .du{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
  .rec button{background:var(--accent);border:none;color:#fff;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
  .rec button.sec{background:transparent;border:1px solid var(--line);color:var(--muted);padding:7px 10px}
  .empty{color:var(--muted);font-size:13px}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:18px}
  .note{color:var(--amber);font-size:12.5px;margin:10px 0 0;line-height:1.45}
  .rec button.cloud{background:var(--accent);font-weight:700;padding:9px 12px}
  .rec button.cloud.ok{background:var(--ok)}
  .rec button.cloud.fail{background:var(--danger)}
  .rec button.cloud.off{background:var(--amber);color:#1a1d24}
  .rec button.sec.nudge{border-color:var(--amber);color:var(--amber);animation:ozniPulse 0.9s ease-in-out 3}
  @keyframes ozniPulse{0%,100%{box-shadow:0 0 0 0 rgba(240,180,60,0)}50%{box-shadow:0 0 0 4px rgba(240,180,60,.35)}}
  .consent{color:var(--muted);font-size:12px;margin:8px 0 0;line-height:1.45}
  .field-label{display:block;font-size:13px;margin:10px 0 5px;color:var(--muted)}
  button:disabled{opacity:.55;cursor:wait}
  #retry-capture{margin:10px auto;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px;font-size:14px}
  /* Per-take quality verdict — thresholds identical to spike/analysis/recording_quality.py, so a
     take the recorder calls good is a take the analysis pipeline also accepts. */
  .qbadge{font-size:11px;font-weight:700;border-radius:6px;padding:3px 7px;white-space:nowrap}
  .qbadge.ok{background:rgba(34,197,94,.15);color:var(--ok)}
  .qbadge.clipped,.qbadge.silent{background:rgba(239,68,68,.15);color:var(--danger)}
  .qtip{flex-basis:100%;font-size:12px;color:var(--muted);margin-top:-4px}
  /* Sticky in-take warning: the meter's red flash lasts one buffer and is easy to miss while shooting. */
  .takewarn{display:none;margin-top:8px;padding:9px 11px;border-radius:9px;font-size:13px;font-weight:700;line-height:1.35}
  .takewarn.on{display:block;background:rgba(239,68,68,.14);color:var(--danger);border:1px solid rgba(239,68,68,.4)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="title"></h1>
      <p class="sub" id="sub"></p>
      <p class="ver" id="ver"></p>
    </div>
    <div class="toggles">
      <div class="seg" id="modeseg">
        <button data-mode="teste" onclick="setMode('teste')" aria-label="Teste / Test">🎙️</button>
        <button data-mode="fogos" onclick="setMode('fogos')">🎆</button>
        <button data-mode="tiro" onclick="setMode('tiro')">🎯</button>
      </div>
      <div class="seg" id="langseg">
        <button data-lang="pt" onclick="setLang('pt')">PT</button>
        <button data-lang="en" onclick="setLang('en')">EN</button>
      </div>
    </div>
  </header>

  <div class="card"><h2 id="h-rules"></h2><ul class="rules" id="rules"></ul></div>
  <div class="card"><h2 id="h-plan"></h2><table><thead id="planhead"></thead><tbody id="planbody"></tbody></table></div>

  <div class="card">
    <h2 id="h-rec"></h2>
    <p class="note" id="capture-help"></p>
    <label class="field-label" for="device-model" id="model-label"></label>
    <div class="label-row"><input id="device-model" maxlength="80" autocorrect="off" spellcheck="false" placeholder="iPhone 15 / Samsung Galaxy S24"></div>
    <label class="field-label" for="device-os" id="os-label"></label>
    <div class="label-row"><input id="device-os" maxlength="80" autocorrect="off" spellcheck="false" placeholder="iOS 26.0 / Android 16"></div>
    <p class="consent" id="device-help"></p>
    <div class="label-row"><input id="devname" autocapitalize="words" autocorrect="off" spellcheck="false"></div>
    <div class="label-row"><input id="label" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="chips" id="chips"></div>
    <div class="meter" id="meter"><div id="meterbar"></div></div>
    <div class="meterrow">
      <span id="db">–∞ dB</span>
      <span class="clipwarn" id="clipwarn"></span>
      <span id="pk"></span>
    </div>
    <div class="takewarn" id="takewarn"></div>
    <div class="timer" id="timer">00:00</div>
    <button class="recbtn" id="recbtn" onclick="toggle()"></button>
    <div class="err" id="err"></div>
    <button id="retry-capture" type="button" hidden onclick="retryUnassembledTake()"></button>
    <p class="note" id="accelnote" style="text-align:center;margin-top:6px"></p>
  </div>

  <div class="card" style="text-align:center;padding:12px 16px"><button id="sharelink" onclick="shareRecorderLink()" style="background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:9px 18px;font-size:14px;font-weight:600;cursor:pointer;width:100%"></button></div>
  <div class="card"><h2 id="h-list"></h2><div id="list"></div><p class="note" id="sendnote"></p><p class="consent" id="consent"></p></div>
  <p class="foot" id="foot"></p>
</div>

<script src="metadata.js?v=2.3"></script>

// Per-take quality thresholds — kept numerically identical to recording_quality.py so the
// recorder and the analysis pipeline never disagree about whether a take is usable.
const Q_SILENT_PEAK = 0.02;    // peak below this => no real signal (the 2026-08-01 dud was 0.004)
const Q_CLIP_FRAC   = 0.005;   // >0.5% of samples at full scale => clipped

/** Coarse verdict for one finished take. Mirrors recording_quality.assess(). */
function assessTake(peak, clipFrac){
  if(!(peak > Q_SILENT_PEAK)) return "silent";   // silent wins: a dead take can't be "clipped"
  if(clipFrac > Q_CLIP_FRAC)  return "clipped";
  return "ok";
}

/** Short badge label + the actionable sentence for a verdict. */
function qualityText(q){
  if(!q) return null;
  const pct = (x)=> (x*100 < 0.1 && x > 0) ? "<0.1" : (x*100).toFixed(x*100 < 10 ? 1 : 0);
  if(q.verdict==="clipped")
    return {cls:"clipped", badge:tt(STR.qClipped), tip:tt(STR.qClippedTip).replace("{frac}", pct(q.clipFrac))};
  if(q.verdict==="silent")
    return {cls:"silent", badge:tt(STR.qSilent), tip:tt(STR.qSilentTip).replace("{pk}", pct(q.peak))};
  return {cls:"ok", badge:tt(STR.qOk), tip:tt(STR.qOkTip).replace("{pk}", pct(q.peak))};
}

/** After Stop: keep a bad verdict on screen so the shooter re-records straight away. */
function showTakeVerdict(q){
  const t = qualityText(q); const box = el("takewarn");
  if(!t || q.verdict==="ok"){ box.className="takewarn"; box.textContent=""; return; }
  box.className="takewarn on";
  box.textContent = (q.verdict==="silent" ? tt(STR.warnQuiet) : tt(STR.warnClip)) + " " + t.tip;
}

      {w:{pt:"Ambiente normal",en:"Normal surroundings"},d:{pt:"celular apoiado",en:"phone resting"},n:"20–30 s"},

    label0:"bomba",

// ---- CRC-32 (standard reflected polynomial 0xEDB88320) ----
// Used only by makeStoredZip. Both functions use ONLY ArrayBuffer/DataView/Uint8Array/Blob
// so they are safe to define and call inside the Node verify shim (no browser-only APIs).
const CRC32_TABLE = (()=>{
  const t=new Uint32Array(256);
  for(let i=0;i<256;i++){
    let c=i;

// Build a minimal STORED (method 0) zip containing one or several entries.
// STORE (method 0) is deliberate: WhatsApp ships .zip documents byte-for-byte, so the
// uncompressed WAV inside survives the transfer without any re-encoding.
// bytes: Uint8Array of file bytes (e.g. WAV). Returns a single-part Blob "application/zip".
function makeStoredZip(filename, bytes){
  if(Array.isArray(filename)) return makeStoredZipEntries(filename);
  const size = bytes.length;
  const crc  = crc32(bytes);
  // Encode filename — TextEncoder is a standard global in both browser and Node (not DOM).
  const nameBytes = new TextEncoder().encode(filename);
  const nameLen   = nameBytes.length;

  // Exact total: LocalHeader(30) + name + data + CentralHeader(46) + name + EOCD(22)
  const localStart    = 0;
  const dataStart     = 30 + nameLen;
  const cdStart       = dataStart + size;
  const eocdStart     = cdStart + 46 + nameLen;
  const totalLen      = eocdStart + 22;

  const buf = new ArrayBuffer(totalLen);
  const v   = new DataView(buf);
  const u8  = new Uint8Array(buf);

  // Local File Header
  v.setUint32(localStart +  0, 0x04034b50, true); // signature PK\x03\x04
  v.setUint16(localStart +  4, 20,          true); // version needed: 2.0
  v.setUint16(localStart +  6, 0,           true); // flags
  v.setUint16(localStart +  8, 0,           true); // method: STORE (0)
  v.setUint16(localStart + 10, 0,           true); // mod time
  v.setUint16(localStart + 12, 0,           true); // mod date
  v.setUint32(localStart + 14, crc,         true); // CRC-32
  v.setUint32(localStart + 18, size,        true); // compressed size
  v.setUint32(localStart + 22, size,        true); // uncompressed size
  v.setUint16(localStart + 26, nameLen,     true); // file name length
  v.setUint16(localStart + 28, 0,           true); // extra field length
  u8.set(nameBytes, localStart + 30);               // file name bytes
  u8.set(bytes,     dataStart);                     // file data (verbatim, no inflate)

  // Central Directory File Header
  v.setUint32(cdStart +  0, 0x02014b50, true); // signature PK\x01\x02
  v.setUint16(cdStart +  4, 20,          true); // version made by
  v.setUint16(cdStart +  6, 20,          true); // version needed
  v.setUint16(cdStart +  8, 0,           true); // flags
  v.setUint16(cdStart + 10, 0,           true); // method: STORE (0)
  v.setUint16(cdStart + 12, 0,           true); // mod time
  v.setUint16(cdStart + 14, 0,           true); // mod date
  v.setUint32(cdStart + 16, crc,         true); // CRC-32
  v.setUint32(cdStart + 20, size,        true); // compressed size
  v.setUint32(cdStart + 24, size,        true); // uncompressed size
  v.setUint16(cdStart + 28, nameLen,     true); // file name length
  v.setUint16(cdStart + 30, 0,           true); // extra field length
  v.setUint16(cdStart + 32, 0,           true); // file comment length
  v.setUint16(cdStart + 34, 0,           true); // disk number start
  v.setUint16(cdStart + 36, 0,           true); // internal file attributes
  v.setUint32(cdStart + 38, 0,           true); // external file attributes
  v.setUint32(cdStart + 42, 0,           true); // relative offset of local header
  u8.set(nameBytes, cdStart + 46);               // file name bytes

  // End Of Central Directory
  v.setUint32(eocdStart +  0, 0x06054b50, true); // signature PK\x05\x06
  v.setUint16(eocdStart +  4, 0,           true); // disk number
  v.setUint16(eocdStart +  6, 0,           true); // disk with cd start
  v.setUint16(eocdStart +  8, 1,           true); // cd records on this disk

  v.setUint32(eocdStart + 12, 46 + nameLen,true); // size of central directory
  v.setUint32(eocdStart + 16, cdStart,     true); // offset of cd start
  v.setUint16(eocdStart + 20, 0,           true); // zip file comment length

  // Single-part, exactly-sized buffer — required so the Node shim Blob captures all bytes.
  return new Blob([new Uint8Array(buf)], {type:"application/zip"});
}

// Multiple entries keep the PCM and its provenance together through document sharing.
function makeStoredZipEntries(entries){

  const dataSize = prepared.reduce((n,e)=>n+30+e.name.length+e.bytes.length,0);

    v.setUint32(local+22,e.bytes.length,true); v.setUint16(local+26,e.name.length,true);
    out.set(e.name,local+30); out.set(e.bytes,local+30+e.name.length);
    v.setUint32(central,0x02014b50,true); v.setUint16(central+4,20,true); v.setUint16(central+6,20,true);
    v.setUint16(central+8,0x800,true); v.setUint32(central+16,e.crc,true);

    v.setUint16(central+28,e.name.length,true); v.setUint32(central+42,local,true);

  v.setUint16(central+10,prepared.length,true); v.setUint32(central+12,cdSize,true);
  v.setUint32(central+16,dataSize,true);
  return new Blob([out],{type:"application/zip"});
}

const UPLOAD_MAX_BYTES = 40*1024*1024;   // 40 MB safety margin (~7 min @ 48 kHz mono 16-bit)

  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,rate,true); v.setUint32(28,rate*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);

// Uses Blob.slice (lazy — no big copies in memory). Sample rate is read from the source header.
async function splitWavForUpload(rec){
  if(rec.blob.size <= UPLOAD_MAX_BYTES) return [{name:rec.name, blob:rec.blob}];
  const head = new DataView(await rec.blob.slice(0,44).arrayBuffer());
  const rate = head.getUint32(24,true) || 48000;
  const pcmLen = rec.blob.size - 44;
  let per = UPLOAD_MAX_BYTES - 44; per -= per % 2;              // even byte boundary = whole samples
  const nParts = Math.ceil(pcmLen / per);

  for(let p=0; p<nParts; p++){

    const name = rec.name.replace(/\.wav$/i, `_p${String(p+1).padStart(2,"0")}of${String(nParts).padStart(2,"0")}.wav`);
    parts.push({name, blob:new Blob([wavHeaderBytes(b-a, rate), rec.blob.slice(a,b)], {type:"audio/wav"})});

// now aborts after UPLOAD_TIMEOUT_MS so it retries instead of hanging, with more attempts, jittered
// backoff, and a reason code ("net" | "server") so the UI can tell the user what to actually do.
const UPLOAD_ATTEMPTS = 5;

async function uploadOneBlob(name, blob){

  const headers = { "Authorization":`Bearer ${UPLOAD.anonKey}`, "apikey":UPLOAD.anonKey, "Content-Type":"audio/wav" };  // no x-upsert: insert-only RLS policy needs no UPDATE; paths are unique (deviceId + timestamp)
  let lastStatus = 0, reason = "net";
  for(let attempt=0; attempt<UPLOAD_ATTEMPTS; attempt++){
    const ctrl = (typeof AbortController!=="undefined") ? new AbortController() : null;
    const timer = ctrl ? setTimeout(()=>{ try{ ctrl.abort(); }catch(e){} }, UPLOAD_TIMEOUT_MS) : null;

      if(res.status>=400 && res.status<500) return {ok:false, status:res.status, reason:"server"};   // policy/auth/CORS — no retry, surface it
      reason = "server";   // 5xx → retry

    finally{ if(timer) clearTimeout(timer); }
    if(attempt < UPLOAD_ATTEMPTS-1){
      const base = 800 * Math.pow(2, attempt);              // 0.8s, 1.6s, 3.2s, 6.4s
      const jitter = base * 0.25 * (Math.random()*2 - 1);   // ±25% so retries don't thunder in lockstep
      await new Promise(r=>setTimeout(r, Math.max(300, base + jitter)));
    }
  }
  return {ok:false, status:lastStatus, reason};
}

async function uploadRecording(rec, onPart){
  const parts = await splitWavForUpload(rec);
  if(!rec._uploadedParts) rec._uploadedParts = {};   // resume across retries: a part sent once is not re-sent
  for(let i=0; i<parts.length; i++){
    if(rec._uploadedParts[parts[i].name]) continue;  // already landed on a prior attempt — skip
    if(onPart) try{ onPart(i+1, parts.length); }catch(e){}
    const res = await uploadOneBlob(parts[i].name, parts[i].blob);
    if(!res.ok) return res;                    // clip stays local; button becomes tappable retry
    rec._uploadedParts[parts[i].name] = true;
  }
  return {ok:true, status:200, reason:"ok"};
}

function renderList(){
  const list=el("list");
  if(recs.length===0){ list.innerHTML = `<p class="empty">${tt(STR.empty)}</p>`; return; }
  list.innerHTML="";
  recs.forEach((r,i)=>{
    const row=document.createElement("div"); row.className="rec";
    const nm=document.createElement("span"); nm.className="nm"; nm.textContent=r.name;
    const du=document.createElement("span"); du.className="du"; du.textContent=r.dur.toFixed(1)+"s · "+(r.blob.size/1000000).toFixed(1)+" MB";
    row.appendChild(nm); row.appendChild(du);
    // Quality verdict travels with the take, so a bad one stays visibly bad in the list.
    const qt = qualityText(r.quality);
    if(qt){
      const b=document.createElement("span"); b.className="qbadge "+qt.cls; b.textContent=qt.badge;
      row.appendChild(b);
    }
    if(UPLOAD_ENABLED){
      const cloud=document.createElement("button"); cloud.className="cloud";
      if(r.uploaded){ cloud.classList.add("ok"); cloud.textContent=tt(STR.uploadDone); cloud.disabled=true; }
      else { cloud.textContent=tt(STR.uploadIdle); cloud.onclick=()=>doUpload(i, cloud); }
      row.appendChild(cloud);
    }
    if(i===0 && r.blob.size<=EXPORT_AUTO_MAX_BYTES && !exportAutoPrepared.has(r)){
      exportAutoPrepared.add(r); prepareExport(r);
    }
    const cached=exportCache.get(r);
    const zipBtn=document.createElement("button"); zipBtn.className = UPLOAD_ENABLED ? "sec" : "cloud";
    zipBtn.textContent=tt(cached?.file ? STR.zipFallback : cached && !cached.error ? STR.zipPreparing : STR.zipPrepare);
    zipBtn.disabled=!!(cached && !cached.file && !cached.error);
    zipBtn.onclick=()=>share(i); row.appendChild(zipBtn);
    if(cached?.file){
      const backup=document.createElement("button");backup.className="sec";backup.textContent=tt(STR.backup);
      backup.onclick=()=>{
        try{downloadFile(cached.file,cached.file.name);el("err").textContent=tt(STR.downloaded);}
        catch(e){el("err").textContent=tt(STR.zipError);}
      };row.appendChild(backup);
    }
    const wavBtn=document.createElement("button"); wavBtn.className="sec"; wavBtn.textContent=tt(STR.wav); wavBtn.onclick=()=>shareWav(i); row.appendChild(wavBtn);
    if(r.accel && r.accel.length){
      const accBtn=document.createElement("button"); accBtn.className="sec";
      accBtn.textContent=tt(STR.accel); accBtn.onclick=()=>shareAccel(i); row.appendChild(accBtn);
    }
    if(qt && r.quality && r.quality.verdict!=="ok"){
      const tip=document.createElement("div"); tip.className="qtip"; tip.textContent=qt.tip;
      row.appendChild(tip);
    }
    if(r.persisted===false){
      const warning=document.createElement("div"); warning.className="qtip"; warning.textContent=tt(STR.temporary); row.appendChild(warning);
      const retry=document.createElement("button");retry.className="sec";retry.textContent=tt(STR.retrySave);
      retry.disabled=captureBusy || !!r.saving;retry.onclick=()=>retrySave(r);row.appendChild(retry);
    }else if(r.persisted===true){
      const saved=document.createElement("div");saved.className="qtip";saved.textContent=tt(STR.savedLocal);row.appendChild(saved);
    }
    if(r.integrity?.recovered){
      const warning=document.createElement("div"); warning.className="qtip"; warning.textContent=tt(STR.recoveredTake); row.appendChild(warning);
    }else if(r.metadata?.captureEnd?.interrupted){
      const warning=document.createElement("div"); warning.className="qtip"; warning.textContent=tt(STR.interruptedTake); row.appendChild(warning);
    }
    const del=document.createElement("button"); del.className="sec"; del.textContent=tt(STR.delete);
    del.disabled=captureBusy || !!r.saving;
    del.onclick=()=>deleteRecording(r); row.appendChild(del);
    list.appendChild(row);
  });
}

// Best-effort: upload the accel JSON sidecar alongside the WAV. Never throws; failure does
// NOT affect the (canonical) WAV upload or the recording. Only meaningful when UPLOAD_ENABLED.
async function uploadAccelSidecar(rec){
  try{
    if(!rec || !rec.accel || !rec.accel.length) return;
    const deviceId = getDeviceId();
    const path = `${UPLOAD.url}/storage/v1/object/${UPLOAD.bucket}/${deviceId}/${encodeURIComponent(rec.name)}.accel.json`;
    const headers = { "Authorization":`Bearer ${UPLOAD.anonKey}`, "apikey":UPLOAD.anonKey, "Content-Type":"application/json" };  // plain insert, insert-only like WAV
    const body = JSON.stringify({ rate:rec.rate||recRate, dur:rec.dur, samples:rec.accel });
    await fetch(path, { method:"POST", headers, body });   // result ignored on purpose — WAV is canonical
  }catch(e){ /* swallow: accel upload is best-effort and must never fail the recording */ }
}

// ---- doUpload: drives the cloud button through dummy-proof states.
// NEVER deletes or modifies the recording on failure — the clip stays in IDB and zip/WAV remain. ----
let nameNudged = false;   // one-time, non-blocking: second tap always sends
async function doUpload(i, btn){
  if(typeof navigator!=="undefined" && navigator.onLine===false){
    btn.className="cloud off"; btn.textContent=tt(STR.uploadOffline); return;   // recording untouched
  }
  if(!getDeviceName() && !nameNudged){
    nameNudged = true;
    el("err").textContent = tt(STR.nudge);
    try{ el("devname").focus(); el("devname").scrollIntoView({block:"center"}); }catch(e){}
    return;   // recording untouched; next tap uploads regardless
  }
  el("err").textContent = "";
  btn.disabled=true; btn.className="cloud"; btn.textContent=tt(STR.uploadSending);
  const res = await uploadRecording(recs[i], (p,n)=>{ if(n>1) btn.textContent = `${tt(STR.uploadSending)} ${p}/${n}`; });
  if(res.ok){
    recs[i].uploaded=true;
    btn.className="cloud ok"; btn.textContent=tt(STR.uploadDone);   // stays disabled
    await markUploaded(recs[i].id);   // persist; recording stays in store regardless
    uploadAccelSidecar(recs[i]);   // fire-and-forget best-effort; never awaited; never affects button state
  } else {
    btn.disabled=false; btn.className="cloud fail";
    btn.textContent = res.reason==="server" ? tt(STR.uploadServer)
                    : res.reason==="net"    ? tt(STR.uploadNet)
                    :                          tt(STR.uploadFail);
    el("err").textContent = tt(STR.uploadRetryNudge);   // reassure (clip is safe) + point to the always-works fallback
    try{                                                 // pulse the 📦 Zip button in this row so the guaranteed path is obvious
      const zip = btn.parentElement && btn.parentElement.querySelector("button.sec");
      if(zip){ zip.classList.remove("nudge"); void zip.offsetWidth; zip.classList.add("nudge");
               setTimeout(()=>{ try{ zip.classList.remove("nudge"); }catch(e){} }, 3000); }
    }catch(e){}
    btn.onclick=()=>doUpload(i, btn);   // tappable retry; clip never removed
  }
}

// ---- markUploaded: read-modify-write the IDB recordings record (guard for no-IDB). ----
async function markUploaded(id){
  if(!id) return;
  const db=await dbReady(); if(!db) return;
  try{
    const store=db.transaction("recordings","readwrite").objectStore("recordings");
    const rec=await idbReq(store.get(id));
    if(rec){ rec.uploaded=true; await idbReq(db.transaction("recordings","readwrite").objectStore("recordings").put(rec)); }
  }catch(e){ /* persistence is best-effort; the ✅ for this session still shows from recs[i].uploaded */ }
}

// Primary share: wrap recording in a STORED zip so WhatsApp treats it as a document
// and delivers it byte-for-byte (WhatsApp transcodes raw audio to Opus, destroying quality).
async function share(i){
  const r=recs[i];
  let file=exportCache.get(r)?.file;
  if(!file){
    if(exportCache.get(r)?.error) exportCache.delete(r);
    const preparing=prepareExport(r); renderList();
    file=await preparing;
    if(!file) el("err").textContent=tt(STR.zipError);
    // A second, fresh tap opens the share sheet once the file is ready.
    return;
  }
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:file.name}); return; }catch(e){ if(e.name==="AbortError")return; }
  }
  downloadFile(file,file.name);
  el("err").textContent=tt(STR.downloaded);
}

function downloadFile(blob,name){
  const url=URL.createObjectURL(blob), a=document.createElement("a"); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}

async function retrySave(rec){
  if(captureBusy || rec.saving || recorderLeaseAllowed===false || !recs.includes(rec)) return;
  rec.saving=true;renderList();
  try{
    const db=await dbReady();if(!db)throw new Error(tt(STR.storageRequired));
    const saved={...rec,persisted:true};delete saved.saving;
    await finalizeSession(db,{sessionId:rec.sessionId||rec.id},saved);
    rec.persisted=true;
    if(!hasUnsafeRecording()){captureFailure="";el("err").textContent=tt(STR.savedLocal);}
  }catch(e){captureFailure=tt(STR.unsavedBlocked);showCaptureFailure();}
  finally{rec.saving=false;renderList();setRecUI();}
}

async function deleteRecording(rec){
  if(recorderLeaseAllowed===false || captureBusy || rec.saving) return;
  if(!confirm(tt(STR.deleteConfirm))) return;
  try{
    const db=await dbReady();
    if(db) await new Promise((resolve,reject)=>{
      const tx=db.transaction(["recordings","sessions","chunks"],"readwrite");
      tx.oncomplete=resolve; tx.onabort=()=>reject(tx.error||new Error("Delete aborted")); tx.onerror=()=>{};
      tx.objectStore("recordings").delete(rec.id);
      const sid=rec.sessionId || rec.id?.replace(/_rec$/,"");
      if(sid){
        tx.objectStore("sessions").delete(sid);
        const cursor=tx.objectStore("chunks").openCursor(IDBKeyRange.bound([sid,0],[sid,Number.MAX_SAFE_INTEGER]));
        cursor.onsuccess=()=>{const c=cursor.result;if(c){c.delete();c.continue();}};
      }
    });
    exportCache.delete(rec); recs=recs.filter(r=>r!==rec); renderList();setRecUI();
  }catch(e){el("err").textContent=state.lang==="pt" ? "Não foi possível apagar. Tente de novo." : "Could not delete. Try again.";}
}

// Secondary share: raw WAV — for the user's own AirDrop-to-Mac / email flow.
async function shareWav(i){
  const r=recs[i]; const file=new File([r.blob], r.name, {type:"audio/wav"});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:r.name}); return; }catch(e){ if(e.name==="AbortError")return; }
  }
  downloadFile(r.blob,r.name);
}

// Accel sidecar download/share — mirrors shareWav fallback shape exactly.
// Gated on r.accel?.length so it is never called for recordings without accel data.
async function shareAccel(i){
  const r=recs[i]; if(!r.accel || !r.accel.length) return;
  const base=r.name.replace(/\.wav$/i,"");
  const jsonName=base+".accel.json";
  const payload=JSON.stringify({ rate:r.rate||recRate, dur:r.dur, samples:r.accel });
  const blob=new Blob([payload],{type:"application/json"});
  const file=new File([blob], jsonName, {type:"application/json"});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:jsonName}); return; }catch(e){ if(e.name==="AbortError")return; }
  }
  downloadFile(blob,jsonName);
}

// Share the recorder page URL with a bilingual invite; clipboard fallback shows a notice.
async function shareRecorderLink(){
  const url=location.href;
  if(navigator.share){
    try{ await navigator.share({title:tt(STR.inviteTitle), text:tt(STR.invite), url}); return; }catch(e){ if(e.name==="AbortError")return; }
  }
  try{ await navigator.clipboard.writeText(url); el("err").textContent=tt(STR.linkCopied); }catch(e){}
}

// Deep link: ?modo=tiro (or ?mode=tiro / ?modo=fogos) opens directly in that mode — the link
// sent to shooter groups lands on the right instructions with zero taps. Harness-safe (no location in shim).
(function(){
  try{
    if(typeof location === "undefined" || !location.search) return;
    const m = (new URLSearchParams(location.search).get("modo") || new URLSearchParams(location.search).get("mode") || "").toLowerCase();
    if(m === "tiro" || m === "tiros") state.mode = "tiro";
    else if(m === "fogos" || m === "fireworks") state.mode = "fogos";
    else if(m === "teste" || m === "test") state.mode = "teste";
  }catch(e){ /* bad/absent URL params never break the page */ }
})();
el("label").value = MODES[state.mode].label0;
el("devname").value = getDeviceName();
el("devname").oninput = ()=>setDeviceName(el("devname").value);
for(const id of ["device-model","device-os"]){
  try{el(id).value=localStorage.getItem("ozni_"+id)||"";}catch(e){}
  el(id).oninput=()=>{try{localStorage.setItem("ozni_"+id,el(id).value.trim());}catch(e){}};
}
render();

async function init(){
  bindLifecycleEvents();
  if(!await acquireRecorderLease()){setRecUI();return;}
  const db=await dbReady();if(!db){storageBlocked=true;captureFailure=tt(STR.storageRequired);showCaptureFailure();return;}
  try{
    const finalized=await idbReq(db.transaction("recordings","readonly").objectStore("recordings").getAll());
    finalized.sort((a,b)=>(b.ts||0)-(a.ts||0));
    for(const r of finalized)recs.push({...r,metadata:r.metadata||null,persisted:true,uploaded:!!r.uploaded});
    const sessions=await idbReq(db.transaction("sessions","readonly").objectStore("sessions").getAll());
    let recovered=0;
    for(const s of sessions){
      if(s.done)continue;
      const chunks=await readChunks(db,s.sessionId);
      if(!chunks.length){await idbCommit(db,"sessions",tx=>tx.objectStore("sessions").delete(s.sessionId));continue;}
      const {blob,samples}=chunksToWavBlob(chunks,s.rate);
      const stamp=new Date(s.ts||Date.now()).toISOString().replace(/[-:T.Z]/g,"");
      // Never attach the CURRENT phone/user label to a historical recording.
      const name=s.name||`ozni_${safeCaptureLabel(s.label)}_recovered_${stamp}_${s.rate}hz.wav`;
      const sequenceGaps=chunks.some((c,i)=>c.seq!==i);
      const metadata=s.metadata ? {...s.metadata,captureEnd:{reason:"recovered_after_reload",recovered:true,
        capturedSamples:null,savedSamples:samples,durationSeconds:samples/s.rate,interrupted:true,missingTailUnknown:true}} : null;
      const rec={id:s.sessionId,name,blob,dur:samples/s.rate,rate:s.rate,done:true,ts:s.ts||Date.now(),
        metadata,capturedSamples:null,savedSamples:samples,recovered:true,
        integrity:{recovered:true,sequenceGaps,missingTailUnknown:true},accel:null,quality:null,uploaded:false,persisted:false};
      try{await finalizeSession(db,s,{...rec,persisted:true});rec.persisted=true;}
      catch(e){handleIdbError(e);} // The atomic transaction leaves original chunks/session intact.
      recs.unshift(rec);recovered++;
    }
    renderList();
    if(captureFailure)showCaptureFailure();
    else if(recovered)el("err").textContent=tt(STR.recovered).replace("{n}",recovered);
  }catch(e){storageBlocked=true;handleIdbError(e);}
}
const initPromise=init().finally(()=>{initReady=true;setRecUI();});
</script>
